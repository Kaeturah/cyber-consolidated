# Cyber Consolidated — site settings
# GitHub Pages builds this folder (/docs on the master branch) with Jekyll.
# You normally only need to edit content files, not this one.

title: Cyber Consolidated
tagline: IT, identity, cloud and security, documented step by step
description: >-
  A technical portfolio of IT support, identity, cloud and security projects,
  documented as they are built, with evidence for every claim.
author: Franklin
email: franklin@cyber-consolidated.com
github: Kaeturah
url: "https://cyber-consolidated.com"
baseurl: ""
lang: en-GB

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Journal updates live in _posts as YYYY-MM-DD-title.md
permalink: /journal/:year/:month/:title/

feed:
  path: feed.xml

# Each project is a collection of numbered chapters (01-, 02-, ...).
# To add a project: add a collection here, a defaults block below, a folder
# _<name>/ for its chapters, and a landing page using layout: project.
collections:
  iam:
    output: true
  domain_email:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav: journal
  - scope:
      path: ""
      type: iam
    values:
      layout: chapter
      nav: projects
      project: identity-before-detection
      project_title: Identity Before Detection
      project_url: /identity-before-detection/
  - scope:
      path: ""
      type: domain_email
    values:
      layout: chapter
      nav: projects
      project: domain-and-email
      project_title: Domain and Business Email
      project_url: /domain-and-email/
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - _legacy
  - _templates
  - README.md
