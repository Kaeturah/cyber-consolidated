{% assign route_chapters = site.iam | sort: "order" %}
<ol class="route" aria-label="Identity Before Detection build route">
  <li class="is-done">
    <a href="{{ '/identity-before-detection/preparing-the-environment/' | relative_url }}">
      <span class="route-num">00</span>
      <span class="route-name">Environment</span>
      <span class="route-state">Under way</span>
    </a>
  </li>
  {% for c in route_chapters %}{% if c.stage %}
  <li class="{% if c.status == 'Documented' %}is-done{% else %}is-todo{% endif %}{% if c.current %} is-current{% endif %}">
    <a href="{{ c.url | relative_url }}">
      <span class="route-num">0{{ c.stage }}</span>
      <span class="route-name">{{ c.short }}</span>
      <span class="route-state">{% include progress.html doc=c %}</span>
    </a>
  </li>
  {% endif %}{% endfor %}
</ol>
