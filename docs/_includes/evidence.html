{% assign fig_n = fig_n | plus: 1 %}{% if include.image %}{% assign fig_src = include.image | relative_url %}{% else %}{% assign fig_src = include.preview %}{% endif %}<figure class="fig" data-fig>
<div class="fig-frame">{% if fig_src %}<a href="{{ fig_src }}" aria-label="Open full-size screenshot: {{ include.title | escape }}"><img src="{{ fig_src }}" alt="{{ include.alt | default: include.title | escape }}" loading="lazy"></a>{% unless include.image %}<span class="fig-preview-tag">Preview only · not yet approved</span>{% endunless %}<span class="fig-open" aria-hidden="true">Click to enlarge</span>{% else %}<div class="fig-pending"><p class="fig-pending-where">{{ include.where | default: "Screenshot" }}</p><p class="fig-pending-note">Screenshot being redacted before publication</p></div>{% endif %}</div>
<figcaption><span class="fig-num">{{ include.label | default: "Fig." }}{% unless include.label %} {{ fig_n }}{% endunless %}</span><span class="fig-title">{{ include.title }}</span>{% if include.shows %}<div class="fig-notes"><p><b>Shows</b>{{ include.shows }}</p><p><b>What it proves</b>{{ include.proves }}</p></div>{% endif %}</figcaption>
</figure>
