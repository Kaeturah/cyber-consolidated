---
layout: default
---
<article>
  <header class="page headline headline--compact">
    <div>
      {% if page.eyebrow %}<p class="kicker">{{ page.eyebrow }}</p>{% endif %}
      <h1>{{ page.headline | default: page.title }}</h1>
    </div>
    <div>
      {% if page.summary %}<p class="dek">{{ page.summary }}</p>{% endif %}
    </div>
  </header>
  <div class="prose">
{{ content }}
  </div>
</article>
